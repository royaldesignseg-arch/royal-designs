<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Designs</title>

<style>
body{margin:0;font-family:Arial;background:#f8f8f8}

/* NAV */
nav{
position:fixed;
top:0;width:100%;
padding:15px 5%;
display:flex;justify-content:space-between;
background:rgba(0,0,0,0.6);
z-index:1000;color:white
}

/* HERO */
.hero{
height:100vh;
background:url('villa_hero_bg.png') center/cover no-repeat;
display:flex;align-items:center;justify-content:center;
text-align:center;color:white;
position:relative;
animation:zoom 12s infinite alternate;
}

.hero::before{
content:"";
position:absolute;inset:0;
background:rgba(0,0,0,0.5);
}

.hero-content{
position:relative;
animation:fade 1.5s ease;
}

.hero h1{font-size:50px;margin:0}
.hero p{margin-top:10px}

/* ABOUT */
.about{
padding:60px 20px;text-align:center;background:white
}
.about img{
width:250px;border-radius:20px
}

/* GALLERY */
.projects{padding:60px 20px;text-align:center}
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px
}

.card{
height:280px;
border-radius:20px;
background-size:cover;
background-position:center;
position:relative;
cursor:pointer;
overflow:hidden;
transition:.4s
}

.card:hover{transform:scale(1.05)}

.card::after{
content:"";
position:absolute;inset:0;
background:linear-gradient(to top,rgba(0,0,0,.7),transparent);
}

.card h3{
position:absolute;
bottom:15px;left:15px;
color:white;
z-index:2
}

/* LIGHTBOX */
.lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:9999
}

.lightbox img{
max-width:90%;
max-height:90vh;
border-radius:15px
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;right:20px;
background:#25D366;
color:white;
padding:12px 18px;
border-radius:40px;
text-decoration:none
}

/* ANIMATION */
@keyframes zoom{
from{background-size:100%}
to{background-size:110%}
}

@keyframes fade{
from{opacity:0;transform:translateY(40px)}
to{opacity:1}
}
</style>
</head>

<body>

<nav>
<div>Royal Designs</div>
</nav>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<h1>Luxury Interior Design</h1>
<p>Designed for real life execution</p>
</div>
</section>

<!-- ABOUT -->
<section class="about">
<img src="engineer.jpg">
<h2>Lead Architect</h2>
</section>

<!-- PROJECTS -->
<section class="projects">
<h2>Our Work</h2>

<div class="gallery">

<div class="card" style="background-image:url('luxury-kitchen.jpg')" onclick="openImg('luxury-kitchen.jpg')">
<h3>Kitchen</h3>
</div>

<div class="card" style="background-image:url('pink-restaurant.jpg')" onclick="openImg('pink-restaurant.jpg')">
<h3>Restaurant</h3>
</div>

<div class="card" style="background-image:url('living-room.jpg')" onclick="openImg('living-room.jpg')">
<h3>Living Room</h3>
</div>

<div class="card" style="background-image:url('main-door.jpg')" onclick="openImg('main-door.jpg')">
<h3>Doors</h3>
</div>

<div class="card" style="background-image:url('cafe-design.jpg')" onclick="openImg('cafe-design.jpg')">
<h3>Cafe</h3>
</div>

<div class="card" style="background-image:url('dressing-room.jpg')" onclick="openImg('dressing-room.jpg')">
<h3>Dressing</h3>
</div>

<div class="card" style="background-image:url('sahel.jpg')" onclick="openImg('sahel.jpg')">
<h3>Sahel Style</h3>
</div>

<div class="card" style="background-image:url('hero-interior.jpg')" onclick="openImg('hero-interior.jpg')">
<h3>Interior</h3>
</div>

</div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="box" onclick="closeImg()">
<img id="img">
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/201116211118" class="whatsapp">WhatsApp</a>

<script>
function openImg(src){
document.getElementById("box").style.display="flex";
document.getElementById("img").src=src;
}
function closeImg(){
document.getElementById("box").style.display="none";
}
</script>

</body>
</html>
