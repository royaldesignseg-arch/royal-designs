<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interior Design</title>

<style>
body {margin:0;font-family:Arial;background:#f8f8f8}

/* HERO */
.hero{
height:100vh;
background:url('images/hero-interior.jpg') center/cover no-repeat;
display:flex;align-items:center;justify-content:center;
color:#fff;text-align:center;position:relative;overflow:hidden;
animation:heroZoom 10s ease-in-out infinite alternate;
}
.hero::before{
content:"";position:absolute;inset:0;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.3));
}
.hero-content{position:relative;z-index:2;animation:fadeUp 1.5s ease}
.hero h1{font-size:52px;margin:0}
.hero p{margin-top:10px}

@keyframes heroZoom{
from{background-size:100%}
to{background-size:115%}
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(40px)}
to{opacity:1;transform:translateY(0)}
}

/* ABOUT */
.about{padding:60px 20px;text-align:center;background:#fff}
.profile-img{width:250px;border-radius:20px}

/* PROJECTS */
.projects{padding:60px 20px;text-align:center}
.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px
}

.card{
position:relative;
overflow:hidden;
border-radius:15px;
cursor:pointer
}
.card img{
width:100%;
height:260px;
object-fit:cover;
transition:.4s
}
.card:hover img{transform:scale(1.1)}

.card span{
position:absolute;
bottom:10px;left:10px;
background:rgba(0,0,0,.6);
color:#fff;
padding:6px 12px;
border-radius:20px;
font-size:14px
}

/* LIGHTBOX */
.lightbox{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:9999
}
.lightbox img{
max-width:90%;
max-height:90vh;
border-radius:15px
}
.close{
position:absolute;
top:20px;right:30px;
font-size:40px;color:#fff;
cursor:pointer
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;right:20px;
background:#25D366;
color:#fff;
padding:12px 18px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<h1>From Concept to Reality</h1>
<p>Interior design crafted for real spaces</p>
</div>
</section>

<!-- ABOUT -->
<section class="about">
<img src="images/engineer.jpg" class="profile-img">
<h2>Lead Architect</h2>
</section>

<!-- PROJECTS -->
<section class="projects">
<h2>Our Actual Work</h2>

<div class="gallery">

<div class="card" onclick="openImg('images/kitchen-modern.jpg')">
<img src="images/kitchen-modern.jpg"><span>Modern Kitchen</span>
</div>

<div class="card" onclick="openImg('images/pink-restaurant.jpg')">
<img src="images/pink-restaurant.jpg"><span>Restaurant</span>
</div>

<div class="card" onclick="openImg('images/living-room.jpg')">
<img src="images/living-room.jpg"><span>Living Room</span>
</div>

<div class="card" onclick="openImg('images/main-door.jpg')">
<img src="images/main-door.jpg"><span>Doors</span>
</div>

<div class="card" onclick="openImg('images/luxury-kitchen.jpg')">
<img src="images/luxury-kitchen.jpg"><span>Luxury Kitchen</span>
</div>

<div class="card" onclick="openImg('images/cafe-design.jpg')">
<img src="images/cafe-design.jpg"><span>Cafe</span>
</div>

<!-- الجديد -->
<div class="card" onclick="openImg('images/sahel.jpg')">
<img src="images/sahel.jpg"><span>Sahel Design</span>
</div>

<div class="card" onclick="openImg('images/dressing-room.jpg')">
<img src="images/dressing-room.jpg"><span>Dressing Room</span>
</div>

</div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="box" onclick="closeImg()">
<span class="close">&times;</span>
<img id="img">
</div>

<!-- WHATSAPP -->
<a href="https://wa.me/201116211118" class="whatsapp">WhatsApp</a>

<script>
function openImg(src){
document.getElementById("box").style.display="flex";
document.getElementById("img").src=src;
}
function closeImg(){
document.getElementById("box").style.display="none";
}
</script>

</body>
</html>
